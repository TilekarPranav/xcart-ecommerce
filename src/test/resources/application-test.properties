# ======================
# H2 Database
# ======================
spring.datasource.url=jdbc:h2:mem:testdb;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false

spring.main.allow-bean-definition-overriding=true

# ======================
# Kafka (Dummy values for tests)
# ======================
spring.kafka.bootstrap-servers=localhost:9092
spring.kafka.properties.security.protocol=PLAINTEXT
spring.flyway.enabled=false

app.jwt.secret=test-secret-for-local-tests-7f3c9a1e5d8b2c6f4a0e9d7b1c5f8a3e6d2b9c4f7a1e5d8
app.jwt.access-token-expiration-ms=900000
app.jwt.refresh-token-expiration-ms=604800000
