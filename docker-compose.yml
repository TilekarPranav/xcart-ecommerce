# Docker Compose for local development of Xcart E-Commerce
# Spins up PostgreSQL + the backend app. Kafka is cloud-hosted (Aiven), so it's
# not included here — set KAFKA_BOOTSTRAP_SERVERS and cert-related env vars in .env.
#
# Usage:
#   1. Copy .env.example to .env and fill in your secrets
#   2. docker-compose up -d
#   3. API will be available at http://localhost:8080

services:
  # ─────────────── PostgreSQL Database ───────────────
  postgres:
    image: postgres:16-alpine
    container_name: xcart-postgres
    environment:
      POSTGRES_DB: ecommerce
      POSTGRES_USER: ${DB_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-root}
    ports:
      - "5432:5432"
    volumes:
      - xcart-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-postgres} -d ecommerce"]
      interval: 5s
      timeout: 5s
      retries: 10

  # ─────────────── Backend (Spring Boot) ───────────────
  app:
    build: .
    container_name: xcart-backend
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/ecommerce
      DB_USERNAME: ${DB_USERNAME:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-root}
      JWT_SECRET: ${JWT_SECRET:-ZWNvbW1lcmNlLXN1cGVyLXNlY3JldC1rZXktY2hhbmdlLW1lLWluLXByb2R1Y3Rpb24tcGxlYXNlLTEyMzQ1Ng==}
      CLOUDINARY_CLOUD_NAME: ${CLOUDINARY_CLOUD_NAME:-}
      CLOUDINARY_API_KEY: ${CLOUDINARY_API_KEY:-}
      CLOUDINARY_API_SECRET: ${CLOUDINARY_API_SECRET:-}
      KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP_SERVERS:-}
      KAFKA_TRUSTSTORE_PASSWORD: ${KAFKA_TRUSTSTORE_PASSWORD:-}
      KAFKA_KEYSTORE_PASSWORD: ${KAFKA_KEYSTORE_PASSWORD:-}
    ports:
      - "8080:8080"
    restart: unless-stopped

volumes:
  xcart-pgdata:
